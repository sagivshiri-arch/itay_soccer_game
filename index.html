<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --green-dark:  #1a5c2a;
  --green-mid:   #2d8a46;
  --green-light: #3fb560;
  --grass-stripe1: #2d8a46;
  --grass-stripe2: #339950;
  --white:  #ffffff;
  --yellow: #FFE234;
  --orange: #FF6B2B;
  --red:    #E8263A;
  --sky:    #87CEEB;
  --text-dark: #0d2e15;
  --shadow: rgba(0,0,0,0.35);
}

body {
  font-family: 'Nunito', sans-serif;
  min-height: 100vh; min-height: 100dvh;
  background: var(--sky);
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-start;
  overflow: hidden;
  user-select: none; -webkit-user-select: none;
}

.screen { display: none; width: 100%; max-width: 480px; min-height: 100dvh; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 18px; }
.screen.active { display: flex; }

.field-bg {
  position: fixed; inset: 0; z-index: -1;
  background: repeating-linear-gradient(180deg, var(--grass-stripe1) 0px, var(--grass-stripe1) 60px, var(--grass-stripe2) 60px, var(--grass-stripe2) 120px);
}
.sky-strip { position: fixed; top: 0; left: 0; right: 0; height: 80px; background: linear-gradient(180deg, #5BA4CF 0%, #87CEEB 100%); z-index: -1; }

/* TITLE */
#screen-title { justify-content: center; }
.title-ball { font-size: 88px; animation: spin-bounce 2s ease-in-out infinite; display: block; text-align: center; }
@keyframes spin-bounce {
  0%,100% { transform: translateY(0) rotate(0deg); }
  40%      { transform: translateY(-22px) rotate(180deg); }
  60%      { transform: translateY(-22px) rotate(200deg); }
}
.title-card { background: rgba(255,255,255,0.92); border-radius: 28px; padding: 28px 36px; text-align: center; box-shadow: 0 8px 32px var(--shadow); width: 100%; }
.title-main { font-size: 38px; font-weight: 900; color: var(--green-dark); line-height: 1.1; }
.title-sub { font-size: 16px; color: #4a7a5a; font-weight: 700; margin-top: 6px; }

.howto { background: rgba(255,255,255,0.88); border-radius: 20px; padding: 16px 20px; width: 100%; display: flex; flex-direction: column; gap: 10px; }
.howto-row { display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 700; color: var(--text-dark); }
.howto-icon { font-size: 28px; flex-shrink: 0; width: 36px; text-align: center; }

/* BUTTONS */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 16px 36px; border: none; border-radius: 50px; font-family: 'Nunito', sans-serif; font-size: 22px; font-weight: 900; cursor: pointer; touch-action: manipulation; transition: transform 0.1s, box-shadow 0.1s; }
.btn:active { transform: translateY(3px); }
.btn-go { background: var(--yellow); color: var(--text-dark); box-shadow: 0 7px 0 #b8a000, 0 10px 24px var(--shadow); width: 100%; }
.btn-go:active { box-shadow: 0 2px 0 #b8a000; }
.btn-small { padding: 10px 24px; font-size: 16px; border-radius: 40px; background: rgba(255,255,255,0.85); color: var(--text-dark); box-shadow: 0 4px 0 rgba(0,0,0,0.15); }

/* MAP */
.map-title-card { background: rgba(255,255,255,0.92); border-radius: 22px; padding: 18px 24px; text-align: center; width: 100%; box-shadow: 0 6px 24px var(--shadow); }
.map-title { font-size: 26px; font-weight: 900; color: var(--green-dark); }

#screen-map { justify-content: flex-start; padding-top: 20px; overflow-y: auto; padding-bottom: 40px; }

.levels-grid {
  display: flex; flex-direction: column; gap: 16px; width: 100%;
}
.group-header {
  font-size: 16px; font-weight: 900; color: white;
  text-shadow: 0 1px 4px var(--shadow);
  background: rgba(0,0,0,0.25); border-radius: 12px;
  padding: 6px 14px; text-align: center;
}
.levels-row {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
}
.level-btn {
  background: rgba(255,255,255,0.9); border: none; border-radius: 16px;
  padding: 10px 4px; cursor: pointer; touch-action: manipulation;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  box-shadow: 0 4px 0 rgba(0,0,0,0.18), 0 6px 16px var(--shadow);
  transition: transform 0.12s; font-family: 'Nunito', sans-serif;
}
.level-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.15); }
.level-btn.locked { opacity: 0.38; cursor: not-allowed; filter: grayscale(0.6); }
.level-btn .lv-emoji  { font-size: 24px; }
.level-btn .lv-num    { font-size: 11px; font-weight: 800; color: #888; }
.level-btn .lv-maxval { font-size: 12px; font-weight: 900; color: var(--text-dark); }
.level-btn .lv-stars  { font-size: 11px; }
.level-btn.current { outline: 3px solid var(--yellow); outline-offset: 2px; }

/* GAME SCREEN */
#screen-game { padding: 12px 16px; justify-content: space-between; min-height: 100dvh; }
.game-top { width: 100%; display: flex; justify-content: space-between; align-items: center; }

/* BALLS (lives) */
.balls-display { display: flex; gap: 4px; align-items: center; }
.life-ball { font-size: 28px; transition: transform 0.3s, opacity 0.3s; }
.life-ball.lost { opacity: 0.2; transform: scale(0.7); filter: grayscale(1); }

.score-badge { background: rgba(255,255,255,0.9); border-radius: 50px; padding: 6px 16px; font-size: 15px; font-weight: 800; color: var(--text-dark); }
.q-progress { font-size: 14px; font-weight: 800; color: white; text-shadow: 0 1px 4px var(--shadow); }

/* QUESTION CARD */
.question-card { background: rgba(255,255,255,0.95); border-radius: 28px; padding: 24px 28px; text-align: center; width: 100%; box-shadow: 0 8px 30px var(--shadow); }
.question-text {
  font-size: 52px; font-weight: 900; color: var(--text-dark); line-height: 1;
  /* LTR so numbers always show left-to-right */
  direction: ltr; unicode-bidi: bidi-override;
}
.question-hint { font-size: 14px; font-weight: 700; color: #888; margin-top: 8px; }

/* DRAG BALL */
.ball-area { position: relative; width: 100%; height: 120px; display: flex; align-items: center; justify-content: center; }
.drag-ball { width: 80px; height: 80px; font-size: 58px; line-height: 80px; text-align: center; cursor: grab; position: absolute; z-index: 10; transition: filter 0.15s; touch-action: none; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.4)); }
.drag-ball.dragging { cursor: grabbing; filter: drop-shadow(0 12px 24px rgba(0,0,0,0.5)) brightness(1.1); z-index: 20; }
.drag-ball.locked { pointer-events: none; opacity: 0.4; }

/* GOALS */
.goals-row { display: flex; gap: 12px; width: 100%; justify-content: center; align-items: flex-end; }
.goal-zone { flex: 1; max-width: 140px; display: flex; flex-direction: column; align-items: center; gap: 6px; touch-action: none; }
.goal-post { width: 100%; height: 80px; background: rgba(255,255,255,0.15); border: 4px solid white; border-bottom: none; border-radius: 12px 12px 0 0; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 900; color: white; text-shadow: 0 2px 8px rgba(0,0,0,0.5); position: relative; transition: background 0.15s, transform 0.15s; }
.goal-post.hover { background: rgba(255,255,235,0.45); transform: scaleY(1.05); }
.goal-post.correct-flash { background: rgba(80,255,120,0.6); animation: goal-flash 0.5s ease; }
.goal-post.wrong-flash { background: rgba(255,80,80,0.5); animation: wrong-shake 0.4s ease; }
@keyframes goal-flash { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }
@keyframes wrong-shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
.goal-net { width: 100%; height: 14px; background: repeating-linear-gradient(90deg, rgba(255,255,255,0.6) 0px, rgba(255,255,255,0.6) 2px, transparent 2px, transparent 10px); border-radius: 0 0 8px 8px; }

/* RED CARD OVERLAY */
.redcard-overlay {
  position: fixed; inset: 0; z-index: 150;
  background: rgba(0,0,0,0.55);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 16px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s;
}
.redcard-overlay.show { opacity: 1; pointer-events: all; }
.redcard {
  width: 110px; height: 155px;
  background: var(--red);
  border-radius: 14px;
  box-shadow: 0 0 0 6px #fff, 0 0 0 10px var(--red), 0 12px 40px rgba(0,0,0,0.6);
  animation: card-pop 0.25s ease;
}
@keyframes card-pop { 0%{transform:scale(0.3) rotate(-15deg);opacity:0} 70%{transform:scale(1.1) rotate(3deg)} 100%{transform:scale(1) rotate(0deg);opacity:1} }
.redcard-text { font-size: 24px; font-weight: 900; color: white; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }

/* SUCCESS OVERLAY */
.feedback-overlay { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; pointer-events: none; opacity: 0; transition: opacity 0.2s; }
.feedback-overlay.show { opacity: 1; }
.feedback-big { font-size: 90px; animation: pop-in 0.3s ease; }
.feedback-label { background: rgba(255,255,255,0.95); border-radius: 20px; padding: 12px 28px; font-size: 22px; font-weight: 900; color: var(--text-dark); text-align: center; box-shadow: 0 6px 24px var(--shadow); animation: pop-in 0.3s ease; }
@keyframes pop-in { 0%{transform:scale(0.4);opacity:0} 80%{transform:scale(1.1)} 100%{transform:scale(1);opacity:1} }

/* RESULT */
#screen-result { justify-content: center; }
.result-card { background: rgba(255,255,255,0.95); border-radius: 28px; padding: 32px 28px; text-align: center; width: 100%; box-shadow: 0 10px 40px var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 14px; }
.result-emoji { font-size: 80px; animation: pop-in 0.4s ease; }
.result-title { font-size: 32px; font-weight: 900; color: var(--text-dark); }
.result-stars { font-size: 44px; letter-spacing: 6px; }
.result-score { font-size: 18px; font-weight: 700; color: #4a7a5a; }

#confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 200; }

/* DIFFICULTY BUTTONS */
.diff-btn { width: 100%; border: none; border-radius: 26px; padding: 18px 20px; cursor: pointer; touch-action: manipulation; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 4px 16px; font-family: 'Nunito', sans-serif; color: var(--text-dark); background: rgba(255,255,255,0.95); box-shadow: 0 7px 0 rgba(0,0,0,0.2), 0 10px 24px var(--shadow); transition: transform 0.1s, box-shadow 0.1s; }
.diff-btn:active { transform: translateY(4px); box-shadow: 0 3px 0 rgba(0,0,0,0.2); }
.diff-emoji { font-size: 48px; grid-row: 1 / span 2; }
.diff-label { font-size: 34px; font-weight: 900; text-align: start; }
.diff-sub { font-size: 18px; text-align: start; }
.diff-stars { font-size: 22px; grid-column: 3; grid-row: 1 / span 2; }
.diff-10 { background: #d9f5e0; }
.diff-15 { background: #fff0c2; }
.diff-20 { background: #ffd9dd; }

/* KID */
.ball-area { height: 165px !important; }
.kid-wrap { position: absolute; bottom: 0; right: calc(50% + 34px); width: 88px; height: 168px; pointer-events: none; z-index: 5; }
.kid-wrap svg, .res-kid svg { width: 100%; height: 100%; overflow: visible; display: block; }
.res-kid { width: 200px; height: 300px; margin: 0 auto; animation: pop-in 0.4s ease; }
.kid g { transform-box: view-box; }
.kid .mouth-open, .kid .mouth-sad, .kid .tear, .kid .cloud, .kid .trophy, .kid .sparks { display: none; }
.kid.cheer .mouth-open, .kid.win .mouth-open { display: block; }
.kid.cheer .mouth-smile, .kid.win .mouth-smile, .kid.sad .mouth-smile, .kid.oops .mouth-smile { display: none; }
.kid.sad .mouth-sad, .kid.oops .mouth-sad { display: block; }
.kid.sad .tear, .kid.sad .cloud { display: block; }
.kid.win .trophy, .kid.win .sparks { display: block; }
.kid .armL { transform-origin: 34px 56px; } .kid .armR { transform-origin: 66px 56px; }
.kid .legL { transform-origin: 41px 106px; } .kid .legR { transform-origin: 59px 106px; }
.kid .shinL { transform-origin: 41px 124px; } .kid .shinR { transform-origin: 59px 124px; }
.kid .torso { transform-origin: 50px 100px; } .kid .head { transform-origin: 50px 46px; }
.kid .dancer { transform-origin: 50px 150px; }
/* idle */
.kid.idle .dancer { animation: k-breathe 1.8s ease-in-out infinite; }
@keyframes k-breathe { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }
.kid.idle .armL { transform: rotate(8deg); } .kid.idle .armR { transform: rotate(-8deg); }
/* run-up */
.kid.run .legL { animation: k-thighA 0.3s linear 1; } .kid.run .legR { animation: k-thighB 0.3s linear 1; }
.kid.run .shinL { animation: k-shinA 0.3s linear 1; } .kid.run .shinR { animation: k-shinB 0.3s linear 1; }
.kid.run .armL { animation: k-armA 0.3s linear 1; } .kid.run .armR { animation: k-armB 0.3s linear 1; }
.kid.run .torso { transform: rotate(4deg); }
@keyframes k-thighA { 0%{transform:rotate(-32deg)} 50%{transform:rotate(30deg)} 100%{transform:rotate(-32deg)} }
@keyframes k-thighB { 0%{transform:rotate(30deg)} 50%{transform:rotate(-32deg)} 100%{transform:rotate(30deg)} }
@keyframes k-shinA { 0%{transform:rotate(0)} 50%{transform:rotate(55deg)} 100%{transform:rotate(0)} }
@keyframes k-shinB { 0%{transform:rotate(55deg)} 50%{transform:rotate(0)} 100%{transform:rotate(55deg)} }
@keyframes k-armA { 0%{transform:rotate(40deg)} 50%{transform:rotate(-40deg)} 100%{transform:rotate(40deg)} }
@keyframes k-armB { 0%{transform:rotate(-40deg)} 50%{transform:rotate(40deg)} 100%{transform:rotate(-40deg)} }
/* kick */
.kid.kick .legR { animation: k-kickT 0.4s ease-in-out forwards; }
.kid.kick .shinR { animation: k-kickS 0.4s ease-in-out forwards; }
.kid.kick .legL { transform: rotate(6deg); }
.kid.kick .torso { animation: k-lean 0.4s ease-in-out forwards; }
.kid.kick .armL { animation: k-kArmL 0.4s ease-in-out forwards; } .kid.kick .armR { animation: k-kArmR 0.4s ease-in-out forwards; }
@keyframes k-kickT { 0%{transform:rotate(-20deg)} 40%{transform:rotate(38deg)} 65%{transform:rotate(-62deg)} 100%{transform:rotate(-38deg)} }
@keyframes k-kickS { 0%{transform:rotate(20deg)} 40%{transform:rotate(85deg)} 65%{transform:rotate(-8deg)} 100%{transform:rotate(12deg)} }
@keyframes k-lean { 0%{transform:rotate(4deg)} 40%{transform:rotate(-7deg)} 65%{transform:rotate(9deg)} 100%{transform:rotate(7deg)} }
@keyframes k-kArmL { 0%{transform:rotate(30deg)} 65%{transform:rotate(-70deg)} 100%{transform:rotate(-60deg)} }
@keyframes k-kArmR { 0%{transform:rotate(-30deg)} 65%{transform:rotate(70deg)} 100%{transform:rotate(55deg)} }
/* cheer after goal */
.kid.cheer .dancer { animation: k-jump 0.45s ease-out 2; }
@keyframes k-jump { 0%,100%{transform:translateY(0)} 45%{transform:translateY(-22px)} }
.kid.cheer .armL { transform: rotate(155deg); } .kid.cheer .armR { transform: rotate(-155deg); }
.kid.cheer .legL, .kid.cheer .legR { transform: rotate(0); }
/* oops after wrong */
.kid.oops .head { animation: k-shake 0.5s ease-in-out 2; }
@keyframes k-shake { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-9deg)} 75%{transform:rotate(9deg)} }
.kid.oops .torso { transform: rotate(5deg); }
.kid.oops .armL { transform: rotate(5deg); } .kid.oops .armR { transform: rotate(-5deg); }
/* win dance */
.kid.win .dancer { animation: k-dance 0.8s ease-in-out infinite; }
@keyframes k-dance { 0%,100%{transform:translateY(0) rotate(-6deg)} 25%{transform:translateY(-14px) rotate(0)} 50%{transform:translateY(0) rotate(6deg)} 75%{transform:translateY(-14px) rotate(0)} }
.kid.win .legL { animation: k-lw1 0.8s ease-in-out infinite; } .kid.win .legR { animation: k-lw2 0.8s ease-in-out infinite; }
.kid.win .shinL { animation: k-sw1 0.8s ease-in-out infinite; } .kid.win .shinR { animation: k-sw2 0.8s ease-in-out infinite; }
@keyframes k-lw1 { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-28deg)} 50%{transform:rotate(0)} }
@keyframes k-lw2 { 0%,100%{transform:rotate(0)} 75%{transform:rotate(28deg)} 50%{transform:rotate(0)} }
@keyframes k-sw1 { 0%,100%{transform:rotate(0)} 25%{transform:rotate(40deg)} 50%{transform:rotate(0)} }
@keyframes k-sw2 { 0%,100%{transform:rotate(0)} 75%{transform:rotate(-40deg)} 50%{transform:rotate(0)} }
.kid.win .head { animation: k-nod 0.4s ease-in-out infinite alternate; }
@keyframes k-nod { from{transform:rotate(-5deg)} to{transform:rotate(5deg)} }
.kid.win .trophy { animation: k-troph 0.4s ease-in-out infinite alternate; transform-origin: 80px 14px; }
@keyframes k-troph { from{transform:rotate(-9deg) translateY(0)} to{transform:rotate(9deg) translateY(-4px)} }
.kid.win .sparks { animation: k-twinkle 0.6s ease-in-out infinite alternate; transform-origin: 50px -6px; }
@keyframes k-twinkle { from{opacity:.35;transform:scale(.85)} to{opacity:1;transform:scale(1.1)} }
/* sad */
.kid.sad .dancer { animation: k-slump 2.4s ease-in-out infinite; }
@keyframes k-slump { 0%,100%{transform:rotate(-1.5deg)} 50%{transform:rotate(1.5deg)} }
.kid.sad .head { transform: translateY(5px) rotate(10deg); }
.kid.sad .torso { transform: rotate(4deg); }
.kid.sad .armL { transform: rotate(-4deg); } .kid.sad .armR { transform: rotate(4deg); }
.kid.sad .tear { animation: k-tear 1.1s ease-in infinite; }
@keyframes k-tear { 0%{transform:translateY(0);opacity:1} 100%{transform:translateY(24px);opacity:0} }
.kid.sad .drop { animation: k-rain 0.7s linear infinite; }
.kid.sad .drop:nth-child(2) { animation-delay: .23s; } .kid.sad .drop:nth-child(3) { animation-delay: .46s; }
@keyframes k-rain { 0%{transform:translateY(0);opacity:1} 100%{transform:translateY(22px);opacity:0} }
/* effects */
.dust { position: fixed; width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,.75); pointer-events: none; z-index: 40; animation: dust-up .55s ease-out forwards; }
@keyframes dust-up { 0%{transform:translate(0,0) scale(.4);opacity:.9} 100%{transform:translate(var(--dx),var(--dy)) scale(1.6);opacity:0} }
.spark { position: fixed; font-size: 26px; pointer-events: none; z-index: 60; animation: spark-out .8s ease-out forwards; }
@keyframes spark-out { 0%{transform:translate(0,0) scale(.3);opacity:1} 100%{transform:translate(var(--dx),var(--dy)) scale(1.2);opacity:0} }
.goal-post.net-hit { animation: net-bulge .5s ease-out; }
@keyframes net-bulge { 0%{transform:scale(1)} 30%{transform:scale(1.12,1.08)} 60%{transform:scale(.97)} 100%{transform:scale(1)} }
.goal-zone { cursor: pointer; touch-action: manipulation; }

/* RESULT SCENES */
.res-kid { position: relative; isolation: isolate; }
.res-kid svg { position: relative; z-index: 2; }
.res-kid::before { content: ''; position: absolute; left: 50%; top: 42%; width: 380px; height: 380px; margin: -190px 0 0 -190px; z-index: 0; border-radius: 50%; opacity: 0; }
.res-kid.win-scene::before { opacity: 1; background: repeating-conic-gradient(from 0deg, rgba(255,226,52,.55) 0 10deg, rgba(255,226,52,0) 10deg 22deg); -webkit-mask-image: radial-gradient(circle, #000 25%, transparent 68%); mask-image: radial-gradient(circle, #000 25%, transparent 68%); animation: rays-spin 12s linear infinite; }
@keyframes rays-spin { to { transform: rotate(360deg); } }
.res-kid.win-scene svg { animation: kid-enter 0.8s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes kid-enter { 0%{transform:translateY(120px) scale(.5);opacity:0} 100%{transform:translateY(0) scale(1);opacity:1} }
.res-kid.sad-scene svg { animation: kid-sink 1s ease-out both; }
@keyframes kid-sink { 0%{transform:translateY(-30px);opacity:0} 100%{transform:translateY(0);opacity:1} }
.res-kid.sad-scene::before { opacity: .55; background: repeating-linear-gradient(105deg, rgba(91,184,240,.0) 0 14px, rgba(91,184,240,.6) 14px 16px); -webkit-mask-image: radial-gradient(circle, #000 20%, transparent 70%); mask-image: radial-gradient(circle, #000 20%, transparent 70%); animation: rain-fall 0.6s linear infinite; }
@keyframes rain-fall { from { background-position: 0 0; } to { background-position: -12px 30px; } }
.orbit { position: absolute; font-size: 28px; z-index: 3; animation: twinkle 1.2s ease-in-out infinite alternate; pointer-events: none; }
@keyframes twinkle { from{transform:scale(.6) rotate(-15deg);opacity:.4} to{transform:scale(1.2) rotate(15deg);opacity:1} }
</style>
</head>
<body>

<div class="sky-strip"></div>
<div class="field-bg"></div>
<canvas id="confetti-canvas"></canvas>

<!-- RED CARD OVERLAY -->
<div class="redcard-overlay" id="redcard-overlay">
  <div class="redcard"></div>
  <div class="redcard-text" id="redcard-text">נסה שוב! 💪</div>
</div>

<!-- SUCCESS FEEDBACK OVERLAY -->
<div class="feedback-overlay" id="feedback-overlay">
  <div class="feedback-big" id="feedback-big">⚽</div>
  <div class="feedback-label" id="feedback-label">גוֹל!</div>
</div>

<!-- TITLE SCREEN -->
<div id="screen-title" class="screen active">
  <span class="title-ball">⚽</span>
  <div class="title-card">
    <div class="title-main">שחקן השנה!</div>
    <div class="title-sub">תרגול חיבור וחיסור</div>
  </div>
  <div class="howto">
    <div class="howto-row"><span class="howto-icon">👀</span><span>ראה את השאלה</span></div>
    <div class="howto-row"><span class="howto-icon">👆</span><span>לחץ על השער, והילד יבעט!</span></div>
    <div class="howto-row"><span class="howto-icon">🏆</span><span>צבור כוכבים!</span></div>
  </div>
  <button class="btn btn-go" onclick="showLevelMap()">▶ יאללה!</button>
</div>

<!-- LEVEL MAP SCREEN -->
<div id="screen-map" class="screen">
  <div class="map-title-card">
    <div class="map-title">⚽ בחר קושי</div>
  </div>
  <div class="levels-grid" id="levels-grid"></div>
  <button class="btn btn-small" onclick="showTitle()">← חזרה</button>
</div>

<!-- GAME SCREEN -->
<div id="screen-game" class="screen">
  <div class="game-top">
    <div class="balls-display" id="balls-disp"></div>
    <div class="score-badge" id="score-badge">0 / 8</div>
    <div class="q-progress" id="q-progress">שאלה 1</div>
  </div>
  <div class="question-card">
    <div class="question-text" id="question-text"></div>
    <div class="question-hint">לחץ על השער הנכון 👆</div>
  </div>
  <div class="ball-area" id="ball-area">
    <div class="kid-wrap" id="kid-wrap"></div>
    <div class="drag-ball" id="drag-ball" draggable="false">⚽</div>
  </div>
  <div class="goals-row" id="goals-row"></div>
  <button class="btn btn-small" onclick="exitGame()">← יציאה</button>
</div>

<!-- RESULT SCREEN -->
<div id="screen-result" class="screen">
  <div class="result-card">
    <div class="res-kid" id="res-kid"></div>
    <div class="result-title" id="res-title">כל הכבוד!</div>
    <div class="result-stars" id="res-stars">⭐⭐⭐</div>
    <div class="result-score" id="res-score"></div>
    <button class="btn btn-go" onclick="retryLevel()" style="margin-top:8px">🔄 שוב!</button>
    <button class="btn btn-go" onclick="showLevelMap()" style="background:#3fb560;box-shadow:0 7px 0 #1a5c2a">🎚️ בחר קושי</button>
  </div>
</div>
<script>
// ===== AUDIO =====
let audioCtx = null;
function unlockAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  else if (audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('touchstart', unlockAudio, { once: true });
document.addEventListener('mousedown',  unlockAudio, { once: true });

// Wrong answer — red card buzz
function playWrongSound() {
  try {
    unlockAudio(); const ctx = audioCtx;
    [0, 0.45].forEach((offset, j) => {
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.connect(g); g.connect(ctx.destination);
      osc.type = 'sawtooth';
      const t = ctx.currentTime + offset;
      osc.frequency.setValueAtTime(380 - j*40, t);
      osc.frequency.exponentialRampToValueAtTime(65, t + 0.38);
      g.gain.setValueAtTime(0.22, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
      osc.start(t); osc.stop(t + 0.45);
    });
  } catch(e) {}
}

// Level complete — victory jingle
function playWinSound() {
  try {
    unlockAudio(); const ctx = audioCtx;
    const melody = [523,659,784,659,784,1047];
    const times  = [0,0.13,0.26,0.42,0.55,0.68];
    melody.forEach((freq,i) => {
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.connect(g); g.connect(ctx.destination);
      osc.type = 'triangle'; osc.frequency.value = freq;
      const t = ctx.currentTime + times[i];
      g.gain.setValueAtTime(0.22, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      osc.start(t); osc.stop(t + 0.22);
    });
  } catch(e) {}
}

// Level failed — sad trombone
function playFailSound() {
  try {
    unlockAudio(); const ctx = audioCtx;
    const notes = [392, 349, 330, 294];
    notes.forEach((freq,i) => {
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.connect(g); g.connect(ctx.destination);
      osc.type = 'triangle'; osc.frequency.value = freq;
      const t = ctx.currentTime + i * 0.18;
      g.gain.setValueAtTime(0.18, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
      osc.start(t); osc.stop(t + 0.25);
    });
  } catch(e) {}
}

// ===== QUESTION POOLS =====
// Each level has a curated pool of {display, answer} pairs.
// genQuestions() picks 10 from the pool, ensuring repetition of key facts.

function makeAdd(a, b)  { return { display: `${a} + ${b} = ?`, answer: a+b }; }
function makeSub(a, b)  { return { display: `${a} \u2212 ${b} = ?`, answer: a-b }; }

// No exercise includes 0 or 1 (neither as a number in the exercise nor as the result).
// Addition: both numbers >= 2, sum in [minSum..maxSum]
function addPool(minSum, maxSum) {
  const p = [];
  for (let s = minSum; s <= maxSum; s++)
    for (let a = Math.max(2, s - 10); a <= Math.min(10, s - 2); a++) p.push(makeAdd(a, s - a));
  return p;
}

// Subtraction: minuend in [minA..maxA], subtracted number >= 2, result >= 2
function subPool(minA, maxA) {
  const p = [];
  for (let a = minA; a <= maxA; a++)
    for (let b = 2; b <= Math.min(10, a - 2); b++) p.push(makeSub(a, b));
  return p;
}

// Mixed: addition and subtraction of the same difficulty range
function mixPool(min, max) {
  return [...addPool(min, max), ...subPool(min, max)];
}

// Pick 10 questions with repetition: shuffle pool, cycle if needed,
// but ensure each unique answer appears at least twice (reinforcement)
function pick10(pool) {
  shuffle(pool);
  // Group by answer, pick 2 from each group if possible, then fill to 10
  const byAnswer = {};
  pool.forEach(q => { (byAnswer[q.answer] = byAnswer[q.answer]||[]).push(q); });
  const selected = [];
  // First pass: up to 2 per answer
  Object.values(byAnswer).forEach(group => {
    selected.push(...group.slice(0, 2));
  });
  shuffle(selected);
  // Trim or fill to exactly 10
  if (selected.length >= 10) return selected.slice(0, 10);
  // Fill from pool cycling
  let i = 0;
  while (selected.length < 10) { selected.push(pool[i % pool.length]); i++; }
  return selected.slice(0, 10);
}

// ===== DIFFICULTIES =====
// Each difficulty = mixed addition + subtraction, never with 0 or 1.
const DIFFICULTIES = {
  10: { emoji:'🌱', label:'עד 10', pool:()=>mixPool(4,10)  },
  15: { emoji:'🔥', label:'עד 15', pool:()=>mixPool(8,15)  },
  20: { emoji:'🚀', label:'עד 20', pool:()=>mixPool(12,20) },
};

function renderLevelMap() {

// ===== GAME =====
function startLevel(key) {
  const def = DIFFICULTIES[key];
  game = { levelId: key, def, questions: pick10(def.pool()), qi: 0, lives: 3, correct: 0, answered: false };
  showScreen('game');
  updateHUD();
  renderQuestion();
}
function retryLevel() { startLevel(game.levelId); }

function updateHUD() {
  const disp = document.getElementById('balls-disp');
  disp.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const b = document.createElement('span');
    b.className = 'life-ball' + (i >= game.lives ? ' lost' : '');
    b.textContent = '⚽'; disp.appendChild(b);
  }
  document.getElementById('score-badge').textContent = `${game.correct} / 10`;
  document.getElementById('q-progress').textContent  = `שאלה ${Math.min(game.qi+1,10)}`;
}

function renderQuestion() {
  if (game.qi >= 10) { endGame(); return; }
  const q = game.questions[game.qi];
  game.answered = false;
  document.getElementById('question-text').textContent = q.display;
  const ball = document.getElementById('drag-ball');
  ball.style.position=''; ball.style.left=''; ball.style.top='';
  ball.classList.remove('locked');
  cancelBallAnim(); game.kicking=false; setKidIdle();
  buildGoals(q.answer);
  setupDrag();
}

function buildGoals(correct) {
  // Generate 3 plausible distractors close to the correct answer
  const max = Math.max(correct + 4, 10);
  const opts = new Set([correct]);
  let tries = 0;
  while (opts.size < 3 && tries++ < 100) {
    const delta = rnd(1, 4);
    const cand  = correct + (Math.random()<0.5?1:-1)*delta;
    if (cand >= 0 && cand <= max) opts.add(cand);
  }
  let fb = 0;
  while (opts.size < 3) { if (fb !== correct) opts.add(fb); fb++; }
  const row = document.getElementById('goals-row');
  row.innerHTML = '';
  shuffle([...opts]).forEach(val => {
    const zone = document.createElement('div');
    zone.className = 'goal-zone'; zone.dataset.val = val;
    zone.innerHTML = `<div class="goal-post">${val}</div><div class="goal-net"></div>`;
    zone.addEventListener('click', () => kickTo(zone));
    row.appendChild(zone);
  });
}

// ===== DRAG =====
let dragState = null, cleanupFns = [];
function clearDragListeners() { cleanupFns.forEach(fn=>fn()); cleanupFns=[]; dragState=null; }

function setupDrag() {
  clearDragListeners();
  const ball = document.getElementById('drag-ball');
  const onStart = e => {
    if (game.answered||game.kicking) return;
    unlockAudio(); e.preventDefault();
    const pt=getPoint(e), rect=ball.getBoundingClientRect();
    dragState={ offsetX:pt.x-(rect.left+rect.width/2), offsetY:pt.y-(rect.top+rect.height/2) };
    ball.classList.add('dragging');
    moveBall(pt.x-dragState.offsetX, pt.y-dragState.offsetY);
  };
  const onMove = e => {
    if (!dragState||game.answered) return; e.preventDefault();
    const pt=getPoint(e);
    moveBall(pt.x-dragState.offsetX, pt.y-dragState.offsetY);
    highlightGoal(pt.x, pt.y);
  };
  const onEnd = e => {
    if (!dragState||game.answered) return; e.preventDefault();
    ball.classList.remove('dragging');
    const pt=getLastPoint(e), goal=getGoalAtPoint(pt.x,pt.y);
    clearGoalHighlights();
    if (goal) kickTo(goal);
    else snapBack();
    dragState=null;
  };
  ball.addEventListener('touchstart',onStart,{passive:false});
  document.addEventListener('touchmove',onMove,{passive:false});
  document.addEventListener('touchend',onEnd,{passive:false});
  ball.addEventListener('mousedown',onStart);
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onEnd);
  cleanupFns.push(
    ()=>ball.removeEventListener('touchstart',onStart),
    ()=>document.removeEventListener('touchmove',onMove),
    ()=>document.removeEventListener('touchend',onEnd),
    ()=>ball.removeEventListener('mousedown',onStart),
    ()=>document.removeEventListener('mousemove',onMove),
    ()=>document.removeEventListener('mouseup',onEnd),
  );
}

function getPoint(e)     { return e.touches?.length       ? {x:e.touches[0].clientX,       y:e.touches[0].clientY}       : {x:e.clientX,y:e.clientY}; }
function getLastPoint(e) { return e.changedTouches?.length ? {x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY} : {x:e.clientX,y:e.clientY}; }
function moveBall(cx,cy) { const b=document.getElementById('drag-ball'); b.style.position='fixed'; b.style.left=(cx-40)+'px'; b.style.top=(cy-40)+'px'; }
function snapBack()      { const b=document.getElementById('drag-ball'); b.style.position=''; b.style.left=''; b.style.top=''; }
function highlightGoal(x,y) { clearGoalHighlights(); const g=getGoalAtPoint(x,y); if(g) g.querySelector('.goal-post').classList.add('hover'); }
function clearGoalHighlights() { document.querySelectorAll('.goal-post.hover').forEach(g=>g.classList.remove('hover')); }
function getGoalAtPoint(x,y) {
  for (const z of document.querySelectorAll('.goal-zone')) {
    const r=z.getBoundingClientRect();
    if (x>=r.left&&x<=r.right&&y>=r.top-60&&y<=r.bottom+30) return z;
  }
  return null;
}

// ===== EFFECTS =====
function dustPuff(x,y) {
  for (let i=0;i<5;i++) {
    const d=document.createElement('div'); d.className='dust';
    d.style.left=(x-8)+'px'; d.style.top=(y-8)+'px';
    d.style.setProperty('--dx',(-30+Math.random()*60)+'px'); d.style.setProperty('--dy',(-6-Math.random()*22)+'px');
    document.body.appendChild(d); setTimeout(()=>d.remove(),600);
  }
}
function sparkBurst(x,y) {
  const em=['⭐','✨','⚽','🌟'];
  for (let i=0;i<8;i++) {
    const a=(Math.PI*2*i)/8, r=50+Math.random()*30;
    const sp=document.createElement('div'); sp.className='spark'; sp.textContent=em[i%4];
    sp.style.left=(x-13)+'px'; sp.style.top=(y-13)+'px';
    sp.style.setProperty('--dx',Math.cos(a)*r+'px'); sp.style.setProperty('--dy',Math.sin(a)*r+'px');
    document.body.appendChild(sp); setTimeout(()=>sp.remove(),850);
  }
}

// ===== KICK =====
function cancelBallAnim() { const b=document.getElementById('drag-ball'); b.getAnimations().forEach(a=>a.cancel()); b.style.zIndex=''; }
function kickTo(zone) {
  if (game.answered || game.kicking) return;
  unlockAudio();
  game.kicking = true;
  clearDragListeners(); clearGoalHighlights();
  const ball = document.getElementById('drag-ball');
  snapBack(); cancelBallAnim();
  const val = parseInt(zone.dataset.val), post = zone.querySelector('.goal-post');
  const wrap = document.getElementById('kid-wrap');
  // 1) run-up
  kidMood('run');
  wrap.animate([{transform:'translateX(0)'},{transform:'translateX(26px)'}],{duration:300,easing:'linear',fill:'forwards'});
  // 2) kick
  setTimeout(() => kidMood('kick'), 300);
  // 3) contact: ball flies
  setTimeout(() => {
    const br = ball.getBoundingClientRect(), gr = post.getBoundingClientRect();
    dustPuff(br.left+br.width/2-30, br.bottom-6);
    const dx = (gr.left+gr.width/2) - (br.left+br.width/2);
    const dy = (gr.top+gr.height/2) - (br.top+br.height/2);
    ball.style.zIndex = 50;
    const anim = ball.animate([
      { transform:'translate(0,0) scale(1.25,0.8) rotate(0deg)', offset:0 },
      { transform:'translate(0,0) scale(1) rotate(30deg)', offset:0.08 },
      { transform:`translate(${dx*0.55}px,${dy*0.55-80}px) scale(0.85) rotate(420deg)`, offset:0.55 },
      { transform:`translate(${dx}px,${dy}px) scale(0.55) rotate(760deg)`, offset:1 }
    ], { duration: 650, easing:'ease-in', fill:'forwards' });
    anim.onfinish = () => {
      game.kicking = false;
      if (!document.getElementById('screen-game').classList.contains('active')) return;
      const gr2 = post.getBoundingClientRect();
      if (val === game.questions[game.qi].answer) { post.classList.add('net-hit'); sparkBurst(gr2.left+gr2.width/2, gr2.top+gr2.height/2); kidMood('cheer'); }
      else kidMood('oops');
      checkAnswer(val, post);
    };
  }, 560);
}

// ===== CHECK ANSWER =====
function checkAnswer(val, goalPost) {
  if (game.answered) return;
  game.answered = true;
  clearDragListeners(); clearGoalHighlights();
  const q = game.questions[game.qi];
  const ball = document.getElementById('drag-ball');
  ball.classList.add('locked');

  if (val === q.answer) {
    // ✅ CORRECT — silent, just visual flash
    game.correct++; game.qi++;
    goalPost.classList.add('correct-flash');
    setTimeout(() => {
      updateHUD();
      renderQuestion();
    }, 900);
  } else {
    // ❌ WRONG — sound + red card, retry same question
    game.lives--;
    goalPost.classList.add('wrong-flash');
    playWrongSound();
    showRedCard();
    updateHUD();
    setTimeout(() => {
      hideRedCard();
      if (game.lives <= 0) { endGame(); return; }
      snapBack(); cancelBallAnim(); setKidIdle();
      ball.classList.remove('locked');
      buildGoals(q.answer);
      game.answered = false;
      setupDrag();
    }, 2000);
  }
}

// ===== END GAME =====
function endGame() {
  clearDragListeners();
  const correct = game.correct;
  const passed  = correct >= 7;
  let stars = 0;
  if (correct===10) stars=3; else if (correct>=8) stars=2; else if (correct>=7) stars=1;

  const prev = state.stars[game.levelId]||0;
  if (stars>prev) state.stars[game.levelId]=stars;

  saveState();

  { const rk=document.getElementById('res-kid');
    rk.className='res-kid '+(passed?'win-scene':'sad-scene');
    rk.innerHTML = kidSVG(passed?'win':'sad') + (passed ? ['⭐:6%:18%:0s','✨:88%:12%:.3s','🌟:2%:55%:.6s','⭐:92%:50%:.2s','✨:12%:84%:.5s','🌟:84%:82%:.1s'].map(t=>{const[e,x,y,d]=t.split(':');return `<span class="orbit" style="left:${x};top:${y};animation-delay:${d}">${e}</span>`;}).join('') : ''); }
  document.getElementById('res-title').textContent  = passed?'כל הכבוד!':'נסה שוב!';
  document.getElementById('res-stars').textContent  = '⭐'.repeat(stars)+'☆'.repeat(3-stars);
  document.getElementById('res-score').textContent  = `${correct} מתוך 10 נכונות`;

  showScreen('result');
  if (passed) { launchConfetti(3200); setTimeout(playWinSound,150); }
  else        { setTimeout(playFailSound,150); }
}

// ===== CONFETTI =====
const confCanvas=document.getElementById('confetti-canvas');
const confCtx=confCanvas.getContext('2d');
let confParticles=[],confAnim=null;
function launchConfetti(duration) {
  confCanvas.width=window.innerWidth; confCanvas.height=window.innerHeight;
  const colors=['#FFE234','#FF6B2B','#3fb560','#87CEEB','#fff','#E8263A','#a855f7'];
  for(let i=0;i<120;i++) confParticles.push({
    x:Math.random()*confCanvas.width,y:-20,
    vx:(Math.random()-.5)*6,vy:Math.random()*5+2,
    color:colors[i%colors.length],
    w:Math.random()*12+5,h:Math.random()*7+3,
    rot:Math.random()*360,rotV:(Math.random()-.5)*12,life:1
  });
  if(confAnim) cancelAnimationFrame(confAnim);
  animConf();
  setTimeout(()=>{confParticles=[];confCtx.clearRect(0,0,confCanvas.width,confCanvas.height);},duration);
}
function animConf() {
  confCtx.clearRect(0,0,confCanvas.width,confCanvas.height);
  confParticles.forEach(p=>{
    confCtx.save();confCtx.translate(p.x,p.y);confCtx.rotate(p.rot*Math.PI/180);
    confCtx.fillStyle=p.color;confCtx.globalAlpha=p.life;
    confCtx.fillRect(-p.w/2,-p.h/2,p.w,p.h);confCtx.restore();
    p.x+=p.vx;p.y+=p.vy;p.rot+=p.rotV;
    if(p.y>confCanvas.height*.75) p.life-=.025;
  });
  confParticles=confParticles.filter(p=>p.life>0);
  if(confParticles.length>0) confAnim=requestAnimationFrame(animConf);
}

// ===== UTILS =====
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
